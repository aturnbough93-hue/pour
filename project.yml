name: Pour
options:
  bundleIdPrefix: com.devin.pour
  createIntermediateGroups: true
targets:
  Pour:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Pour
        excludes:
          - Info.plist
    info:
      path: Pour/Info.plist
      properties:
        CFBundleDevelopmentRegion: $(DEVELOPMENT_LANGUAGE)
        CFBundleDisplayName: Pour
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        NSCameraUsageDescription: Pour uses the camera to scan bottle barcodes into My Bar. Codes are matched on this device and are not sent anywhere.
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: PourBackground
          UIImageRespectsSafeAreaInsets: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        CFBundleURLTypes:
          - CFBundleURLName: com.devin.pour.deeplink
            CFBundleURLSchemes:
              - pour
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.devin.pour
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
  PourTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PourTests
    dependencies:
      - target: Pour
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.devin.pour.tests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Pour:
    build:
      targets:
        Pour: all
        PourTests:
          - test
    test:
      gatherCoverageData: false
      targets:
        - PourTests
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
